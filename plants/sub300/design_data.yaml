# Design-point (THA) data of the "sub300" typical reference unit.
#
# sub300 is a TYPICAL 300 MW subcritical, single-reheat unit with eight
# extractions (3 HP heaters + deaerator + 4 LP heaters). It does not
# represent any real power plant.
#
# Conventions
#   - Units: pressure MPa (absolute), temperature degC, temperature
#     difference K, enthalpy kJ/kg, mass flow kg/s, power MW.
#   - Every numeric leaf is written as {value, unit, ref}; tables carry one
#     `ref` per row. `ref` points to an entry of `references` (public
#     source, S*) or `assumptions` (engineering choice, A*).
#   - Nothing in here comes from plant-internal or confidential documents.

meta:
  name: sub300
  title: Typical 300 MW subcritical single-reheat unit, THA design point
  class: N300-16.7/538/538 (typical, not a specific plant)
  schema_version: 1

references:
  S1:
    title: 热力发电厂设计计算 (course-design document, N300-16.7/538/538 "回热系统计算点参数" table)
    type: secondhand
    url: https://www.renrendoc.com/p-86111899.html
    locator: table "N300-16.7/538/538 型双缸双排汽机组回热系统计算点参数"
    quality: >
      LOW. Only read through a search-engine excerpt; the original page could
      not be opened and the underlying textbook/page was not identified. The
      numbers are thermodynamically consistent (see tests) and are used as
      TYPICAL values, not as design data of an identifiable unit.
  S2:
    title: Shanghai Electric Power Generation Equipment Co., Ltd. Turbine Plant - product page
    type: manufacturer
    url: https://www.shanghai-electric.com/group_en/c/2019-11-09/546899.shtml
    locator: subcritical 300 MW turbines, "typical steam inlet parameters 16.7MPa/538°C/538°C, rated back pressure 4.9kPa to 30kPa"
    quality: read through a search-engine excerpt
  S3:
    title: >
      Wang X., Yan Y., Song A., Liu C. Performance Study and Analysis of a
      300MW High Backpressure Heat Supply Unit Condenser after Retrofit.
      2nd Int. Conf. on Sustainable Development (ICSD 2016), Advances in
      Engineering Research vol. 94, Atlantis Press, 2017, pp. 221-.
    type: paper
    url: https://www.atlantis-press.com/article/25871354.pdf
    locator: Table 1 (design back pressure 4.9 kPa, design cooling water temperature 20 degC, 37000 t/h); Table 2 (terminal temperature difference at design condition 4.2 degC)
    quality: original read
  S4:
    title: >
      Chen H., Wu Y., Xu J., Xu G., Yang Y., Liu W., Shi G. Thermodynamic and
      Economic Analyses of Reformative Design for High Back-Pressure Heating
      in Coal-Fueled Cogeneration Units. Entropy 2019, 21(4), 342.
    type: paper
    url: https://doi.org/10.3390/e21040342
    locator: Table 2 (330 MW air-cooled cogeneration unit, rated heating condition; feedwater 242.6 -> 273.2 degC across the top heater)
    quality: read via PMC; different unit type, used for order-of-magnitude checks only
  S5:
    title: 魏志全等. 300 MW 汽轮机节能降耗改造分析研究. 四川电力技术, 2015.
    type: paper
    url: https://scdljs.ijournals.cn/scdljs/article/pdf/20150319
    locator: Table 1 (test data before overhaul, 295.0 MW, 975.7 t/h, corrected heat rate 8262.4 kJ/kWh, HP efficiency 83.51 %, IP efficiency 93.01 %)
    quality: test data of a CFB unit, order-of-magnitude reference only
  S6:
    title: >
      Yang C., Hao X., Zhang Q., Chen H., Yin Z., Jin F. Performance Analysis
      of a 300 MW Coal-Fired Power Unit during the Transient Processes for
      Peak Shaving. Energies 2023, 16(9), 3727.
    type: paper
    url: https://doi.org/10.3390/en16093727
    locator: >
      Table 1 (HP exhaust 3.687 MPa, hot reheat 3.318 MPa), Table 2 (RH2
      3.5763 MPa), Table 3 (terminal differences -0.7 / 0 / 2.8 K upper and
      5.6 K lower, mechanical efficiency 99.80 %, generator efficiency
      98.95 %, pump efficiency 83 %)
    quality: >
      original read (open access). Different unit (seven heaters); supports
      several assumptions below and is the published validation case of the
      model code (validation_en16093727.yaml).

assumptions:
  A1:
    item: Extraction pressures and enthalpies
    choice: Taken from S1 as typical values of the N300-16.7/538/538 class.
    rationale: >
      No complete, verifiable public THA heat balance was found. S1 is a
      secondhand source, so the unit is declared "typical". Replace with a
      verified table when one becomes available.
  A2:
    item: Reheat system pressure loss
    choice: Hot reheat pressure at IP inlet = 0.90 x HP exhaust pressure.
    rationale: Common design allowance (about 10 %) for cold/hot reheat piping plus reheater. S6 gives 3.318 / 3.687 = 0.900 for a comparable unit.
  A3:
    item: Last LP section (extraction 8 to condenser)
    choice: Isentropic efficiency 0.75 including exhaust (leaving) loss.
    rationale: >
      S1 gives no exhaust enthalpy. 0.75 gives a used-energy end point of
      about 2348 kJ/kg and an overall LP efficiency of about 0.88, typical
      for this class. Engineering judgement; sensitivity about 0.11 % heat
      rate per 0.01.
  A4:
    item: Extraction line pressure loss
    choice: 3 % for HP heaters, 5 % for deaerator, LP heaters and BFPT supply.
    rationale: Common textbook allowances (3-5 % HP, 5-8 % LP). S6 gives 3.5763 / 3.687 = 0.970 for the heater fed from the HP exhaust.
  A5:
    item: Heater upper terminal temperature difference (TTD)
    choice: -1.7 K (H1), 0 K (H2, H3), 2.8 K (H5-H8); referenced to saturation temperature at shell pressure.
    rationale: >
      Typical for imported-technology 300 MW heaters with desuperheating
      zones on the HP heaters. Engineering judgement; gives a final
      feedwater temperature of about 275 degC (S4 reports 273.2 degC for a
      comparable unit). S6 uses -0.7 / 0 / 0 K and 2.8 K in its model, and
      its design feedwater temperature implies about -1.7 K for the top
      heater.
  A6:
    item: Heater drain cooler approach (lower terminal difference)
    choice: 5.6 K for all surface heaters.
    rationale: Common design value (10 degF) for heaters with integral drain cooling zones; S6 uses the same value.
  A7:
    item: Heater water-side pressure drop
    choice: 0.10 MPa per HP heater, 0.05 MPa per LP heater.
    rationale: Typical order of magnitude; negligible effect on heat rate.
  A8:
    item: Boiler feed pump and its drive
    choice: >
      One turbine-driven feed pump (BFPT) covers the whole pressure rise from
      deaerator to 20.5 MPa. Pump isentropic efficiency 0.82, BFPT isentropic
      efficiency 0.80, BFPT steam from extraction 4, exhaust to the main
      condenser at condenser pressure. Motor-driven booster pump and
      BFPT/pump mechanical losses are neglected.
    rationale: >
      Public design heat rates of this class are quoted for steam-driven
      feed pumps, so the pump drive is modelled instead of using a motor.
      Discharge pressure is a typical value for a 16.7 MPa drum boiler
      (drum, superheater, economiser and control valve losses).
  A9:
    item: Condensate pump
    choice: Discharge pressure 1.7 MPa, isentropic efficiency 0.80, motor driven (power not deducted from gross output); excess head is throttled at the deaerator level control valve.
    rationale: Typical values; effect on heat rate is below 0.01 %.
  A10:
    item: Mechanical and generator efficiency
    choice: 0.990 and 0.987.
    rationale: >
      Typical textbook values for a 300 MW hydrogen-cooled generator set.
      S6 uses 0.998 and 0.9895 in its model, which would lower the heat rate
      by 1.05 %; the more conservative textbook values are kept because no
      verified heat rate of this unit class is available to decide.
  A11:
    item: Neglected minor flows and losses
    choice: >
      Gland steam condenser, LP gland sealing steam, boiler blowdown, make-up
      water, attemperation spray, heater radiation losses and auxiliary
      steam are all neglected. Valve stem and HP gland leakage are modelled
      (A17).
    rationale: First-version simplification; these items are small compared with the leakages of A17.
  A12:
    item: Steam generator and main steam line
    choice: >
      The boiler is a pure heat adder (superheater path and reheater path).
      Main steam conditions are given at the turbine stop valve; stop/control
      valve losses are contained in the HP1 section efficiency implied by S1.
      Boiler-side pressure drop is not modelled.
    rationale: The model scope is the turbine cycle; turbine heat rate does not depend on boiler pressure drop.
  A13:
    item: Condenser
    choice: Back pressure 4.9 kPa (S2, S3) instead of the unknown value belonging to S1; no condensate subcooling; drains and BFPT exhaust enter at condenser pressure.
    rationale: S1's back pressure could not be read; 4.9 kPa is a verified public design value for this class.
  A14:
    item: Deaerator
    choice: Sliding pressure, shell pressure = extraction 4 pressure x 0.95; outlet is saturated liquid; no vent loss.
    rationale: Standard treatment in principle heat balance calculations.
  A15:
    item: Heat rate definition
    choice: Gross turbine heat rate = (main steam heat + reheat heat) / generator terminal output.
    rationale: Usual definition for a unit with steam-driven feed pump; boiler efficiency and auxiliary power are excluded.
  A16:
    item: Calibration reference
    choice: >
      The reference for power and heat rate is an independent classical
      series heat balance (plants/sub300/handcalc.py, CoolProp only) on the
      same parameters; tolerance 0.5 %.
    rationale: >
      No verifiable public design heat rate belonging to S1 was found. The
      comparison proves that the TESPy network implements the intended
      topology and specifications; it does not prove agreement with a real
      unit. Agreement with published design data is tested separately on a
      different unit (S6, validation_en16093727.yaml, test_validation.py).
  A17:
    item: Valve stem and gland leakage
    choice: >
      Two lumped leakage flows at main steam enthalpy that bypass the HP
      turbine and the reheater: 0.42 % of main steam flow to the shell of H3
      (valve stem leak-off) and 1.74 % to the IP inlet (HP-IP gland of a
      combined HP-IP casing).
    rationale: >
      The fractions are derived from the published design data of S6 (mass
      balances of its Tables 1 and 2: 1.09 and 4.54 of 260.38 kg/s, see
      validation_en16093727.yaml). Source state and routing are not
      published and are engineering judgement; S6's published power can only
      be met with a plausible LP efficiency if the larger flow re-enters the
      turbine. Effect on heat rate: +0.51 % against no leakage.
  A18:
    item: Turbine off-design behaviour
    choice: >
      Every section between extraction points follows Stodola's cone law
      with its design flow capacity; section isentropic efficiencies stay at
      their design values. No governing stage: load is controlled by sliding
      pressure and by throttling in the main steam valves (throttle
      governing). The extraction line relative pressure loss stays constant.
    rationale: >
      Standard textbook part-load method (Flügel/Stodola) and the same
      simplification S6 uses in its model (Table 3). Real 300 MW units mostly
      use nozzle governing; throttle governing overstates the loss wherever
      the valves throttle (in this data set below about 75 % load), and
      constant efficiencies understate the loss of the last LP stages at
      low load. Engineering judgement.
  A19:
    item: Mechanical and generator losses off design
    choice: Mechanical loss constant in MW (design value); generator efficiency constant.
    rationale: >
      Bearing and windage losses hardly depend on load. Generator losses are
      partly constant (iron, windage) and partly quadratic (copper); keeping
      the efficiency constant is a simplification. Effect at 50 % load of
      the order of 0.5 % on heat rate.
  A20:
    item: Leakage flows off design
    choice: >
      Martin's labyrinth formula relative to the design point, m ~ p1 /
      sqrt(p1 v1) * sqrt(1 - (p2/p1)^2), with p1, v1 at the leakage source
      (main steam upstream of the valves for both leakages) and p2 at the
      destination.
    rationale: >
      Standard seal flow model. Using main steam pressure upstream of the
      valves for the HP-IP gland overstates that leakage where the valves
      throttle; its true driving pressure is the HP inlet pressure.
  A21:
    item: Heaters, pumps and pressure losses off design
    choice: >
      Heater terminal differences and water-side pressure drops stay at
      design values; pump and feed pump turbine efficiencies stay constant;
      condensate pump discharge pressure stays constant; boiler and reheater
      pressure losses scale with m^2 v (constant zeta). Deaerator pressure
      slides with extraction 4 (no auxiliary steam).
    rationale: >
      The lumped heater model cannot be driven by a UA value for H1, whose
      upper terminal difference is negative. Constant terminal differences
      are a common simplification and slightly conservative. Engineering
      judgement.
  A22:
    item: Main steam pressure curve
    choice: >
      Linear in load through the design point (1.0, 16.7 MPa) and the ratio
      13.25 / 16.67 MPa at 75 % THA published in S6, down to 40 % load
      (8.48 MPa); constant below 40 % and above 100 %.
    rationale: >
      S6 is the only public sliding pressure point found for this class.
      The straight line and the 40 % break point are assumptions; the
      default operating mode is this curve, pure sliding pressure and
      constant pressure are available as options.
  A23:
    item: Condenser off design
    choice: >
      Default: design back pressure (manufacturers' part-load heat balances
      are usually quoted at rated back pressure). Optional: cooling water
      flow and condenser UA kept at design values with a given cooling
      water inlet temperature.
    rationale: Engineering judgement; UA independent of steam load is a simplification.

parameters:
  rating:
    gross_power: {value: 300.0, unit: MW, ref: S2}

  main_steam:
    p: {value: 16.7, unit: MPa, ref: S2}
    T: {value: 538.0, unit: degC, ref: S2}

  reheat:
    T: {value: 538.0, unit: degC, ref: S2}
    pr: {value: 0.90, unit: "-", ref: A2}

  turbine:
    eta_mech: {value: 0.990, unit: "-", ref: A10}
    eta_gen: {value: 0.987, unit: "-", ref: A10}
    # Expansion line, in flow order. Each section ends at an extraction
    # point (or at the condenser). Give either h_out (kJ/kg) or eta_s.
    # p_out in MPa; "condenser" means condenser pressure.
    reheat_after: HP2
    sections:
      - {label: HP1, cylinder: HP, p_out: 5.954,  h_out: 3142.8, ref: S1}
      - {label: HP2, cylinder: HP, p_out: 3.61,   h_out: 3015.8, ref: S1}
      - {label: IP1, cylinder: IP, p_out: 1.63,   h_out: 3332.2, ref: S1}
      - {label: IP2, cylinder: IP, p_out: 0.803,  h_out: 3134.4, ref: S1}
      - {label: LP1, cylinder: LP, p_out: 0.341,  h_out: 2939.2, ref: S1}
      - {label: LP2, cylinder: LP, p_out: 0.134,  h_out: 2763.5, ref: S1}
      - {label: LP3, cylinder: LP, p_out: 0.0732, h_out: 2669.2, ref: S1}
      - {label: LP4, cylinder: LP, p_out: 0.0256, h_out: 2517.6, ref: S1}
      - {label: LP5, cylinder: LP, p_out: condenser, eta_s: 0.75, ref: A3}

  # Steam leaving the main steam path other than through extractions.
  # source: main_steam | hot_reheat | section label (state at its outlet)
  # destination: heater label (shell) | condenser | section label (inlet)
  # fraction: of main steam flow (alternatively m in kg/s)
  leakages:
    - {label: valve_stem,  source: main_steam, destination: H3,  fraction: 0.0042, ref: [S6, A17]}
    - {label: hp_ip_gland, source: main_steam, destination: IP1, fraction: 0.0174, ref: [S6, A17]}

  # Off-design operation (used by solve_offdesign / load_sweep)
  operation:
    pressure_mode: curve
    # load: fraction of design gross power; p: main steam pressure, MPa
    pressure_curve:
      - {load: 0.40, p: 8.4772,  ref: [S6, A22]}
      - {load: 0.75, p: 13.2738, ref: [S6, A22]}
      - {load: 1.00, p: 16.70,   ref: [S2, A22]}

  # Feedwater heaters in water-flow order (condenser -> boiler).
  # extraction: label of the turbine section whose outlet feeds the heater.
  # line_pr: heater shell pressure / extraction pressure.
  # ttd_u / ttd_l in K, dp_water in MPa. Drains cascade backwards to the
  # previous heater; the first LP heater drains to the condenser and the
  # first HP heater drains to the deaerator.
  heaters:
    - {label: H8,  type: surface,   extraction: LP4, line_pr: 0.95, ttd_u: 2.8,  ttd_l: 5.6, dp_water: 0.05, ref: [A4, A5, A6, A7]}
    - {label: H7,  type: surface,   extraction: LP3, line_pr: 0.95, ttd_u: 2.8,  ttd_l: 5.6, dp_water: 0.05, ref: [A4, A5, A6, A7]}
    - {label: H6,  type: surface,   extraction: LP2, line_pr: 0.95, ttd_u: 2.8,  ttd_l: 5.6, dp_water: 0.05, ref: [A4, A5, A6, A7]}
    - {label: H5,  type: surface,   extraction: LP1, line_pr: 0.95, ttd_u: 2.8,  ttd_l: 5.6, dp_water: 0.05, ref: [A4, A5, A6, A7]}
    - {label: DEA, type: deaerator, extraction: IP2, line_pr: 0.95, ref: [A4, A14]}
    - {label: H3,  type: surface,   extraction: IP1, line_pr: 0.97, ttd_u: 0.0,  ttd_l: 5.6, dp_water: 0.10, ref: [A4, A5, A6, A7]}
    - {label: H2,  type: surface,   extraction: HP2, line_pr: 0.97, ttd_u: 0.0,  ttd_l: 5.6, dp_water: 0.10, ref: [A4, A5, A6, A7]}
    - {label: H1,  type: surface,   extraction: HP1, line_pr: 0.97, ttd_u: -1.7, ttd_l: 5.6, dp_water: 0.10, ref: [A4, A5, A6, A7]}

  condenser:
    p: {value: 0.0049, unit: MPa, ref: A13}
    cw_T_in: {value: 20.0, unit: degC, ref: S3}
    cw_p: {value: 0.2, unit: MPa, ref: A13}
    ttd_u: {value: 4.2, unit: K, ref: S3}

  condensate_pump:
    p_out: {value: 1.7, unit: MPa, ref: A9}
    eta_s: {value: 0.80, unit: "-", ref: A9}

  feed_pump:
    # drive: "turbine" (BFPT, modelled). A motor-driven variant is not
    # implemented in this stage; see A8.
    drive: turbine
    p_out: {value: 20.5, unit: MPa, ref: A8}
    eta_s: {value: 0.82, unit: "-", ref: A8}
    bfpt:
      extraction: IP2
      line_pr: {value: 0.95, unit: "-", ref: A4}
      eta_s: {value: 0.80, unit: "-", ref: A8}

calibration:
  reference: plants/sub300/handcalc.py
  tolerance_power: {value: 0.005, unit: "-", ref: A16}
  tolerance_heat_rate: {value: 0.005, unit: "-", ref: A16}

# Public order-of-magnitude figures used by plausibility tests only (never
# as model inputs).
plausibility:
  final_feedwater_T: {value: 273.2, unit: degC, ref: S4, tolerance: 5.0}
  test_heat_rate_corrected: {value: 8262.4, unit: kJ/kWh, ref: S5}
